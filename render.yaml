services:
  - type: web
    name: lingotrust-translate
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: TRANSLATION_MODE
        value: live
      - key: AUTH_SECURE_COOKIE
        value: "true"
      - key: HOSTED
        value: "true"
      # Add these as secret values in the Render dashboard (do not commit real secrets):
      # TMS_API_TOKEN, TMS_AUTH_MODE, TMS_OAUTH_URL, TMS_BASE_URL,
      # TMS_PROJECT_TEMPLATE_UID, TMS_AI_TEMPLATE_UID, AUTH_ADMIN_USER, AUTH_ADMIN_PASSWORD, AUTH_SECRET
